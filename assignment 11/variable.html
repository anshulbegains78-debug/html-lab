
<!DOCTYPE html>
<html>
<head>
    <title>CSS Variables</title>

    <style>
        :root {
            --main-color: #1d3557;
            --accent-color: #e63946;
            --page-padding: 20px;
        }

        body {
            color: var(--main-color);
            padding: var(--page-padding);
        }

        h1 {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <h1>Welcome to CSS Variables</h1>

    <p>CSS variables make styling easy.</p>

</body>
</html>
