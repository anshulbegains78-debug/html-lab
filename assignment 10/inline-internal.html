

<!DOCTYPE html>
<html>
<head>
    <title>CSS Fundamentals</title>

    <style>
        h1 {
            color: navy;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>

    <h1>Welcome to CSS</h1>

    <p style="color: red;">
        This paragraph is red.
    </p>

    <p class="highlight">
        This paragraph has yellow background.
    </p>

</body>
</html>
