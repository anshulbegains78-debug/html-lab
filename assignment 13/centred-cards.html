
<!DOCTYPE html>
<html>
<head>
    <title>Centred Cards</title>

    <style>
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .card {
            background-color: lightblue;
            padding: 20px;
            width: 150px;
            text-align: center;
            border: 2px solid black;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Our Plans</h1>

    <div class="row">

        <div class="card">
            <h3>Starter</h3>
            <p>Price: 199</p>
        </div>

        <div class="card">
            <h3>Standard</h3>
            <p>Price: 349</p>
        </div>

        <div class="card">
            <h3>Premium</h3>
            <p>Price: 499</p>
        </div>

    </div>

</body>
</html>
