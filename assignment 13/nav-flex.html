
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Navigation</title>

    <style>
        nav {
            display: flex;
            background-color: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }
    </style>
</head>
<body>

    <h1>Navigation Bar</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Events</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
