
<!DOCTYPE html>
<html>
<head>
    <title>Scrolling Box</title>

    <style>
        .scroll-box {
            height: 120px;
            overflow: auto;
            border: 2px solid black;
            padding: 10px;
            width: 250px;
        }
    </style>
</head>
<body>

    <h1>Scrolling Example</h1>

    <div class="scroll-box">
        <p>Line 1</p>
        <p>Line 2</p>
        <p>Line 3</p>
        <p>Line 4</p>
        <p>Line 5</p>
    </div>

</body>
</html>
