
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: lightblue;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lightgreen;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: lightyellow;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: lightgray;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Dashboard Layout</h1>

    <div class="container">

        <div class="header">
            <h2>Header</h2>
        </div>

        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>Menu Items</p>
        </div>

        <div class="main">
            <h3>Main Content</h3>
            <p>Welcome to Dashboard.</p>
        </div>

        <div class="footer">
            <h3>Footer</h3>
        </div>

    </div>

</body>
</html>
